<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Contactos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Directorio de Contactos</h1>

    <div class="formulario">
      <input type="text" id="nombre" placeholder="Nombre" autocomplete="off">
      <input type="tel" id="telefono" placeholder="Teléfono" autocomplete="off">
      <button id="btn-agregar" type="button">Agregar</button>
    </div>

    <input type="text" id="buscador" class="buscador" placeholder="Buscar contacto por nombre..." autocomplete="off">

    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio">Todavía no agregaste contactos.</p>

    <footer class="pie">
      <p id="contador">Contactos: 0</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
